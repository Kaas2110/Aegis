openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Aegis API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: admin-auth
    description: Admin login/session endpoints
  - name: admin
    description: Admin management endpoints (cookie session required)
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /admin/login:
    post:
      operationId: adminLogin
      tags: [admin-auth]
      summary: Exchange admin token for an HttpOnly session cookie
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminLoginInput"
      responses:
        "200":
          description: Logged in (Set-Cookie aegis_admin_session)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminLoginResult"

  /admin/logout:
    post:
      operationId: adminLogout
      tags: [admin-auth]
      summary: Clear session cookie
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminOkResult"

  /admin/whoami:
    get:
      operationId: adminWhoami
      tags: [admin-auth]
      summary: Check current session status
      responses:
        "200":
          description: Session status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminWhoami"

  /admin/settings:
    get:
      operationId: getAdminSettings
      tags: [admin]
      summary: Current global app settings
      responses:
        "200":
          description: Settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSettingsResponse"
    post:
      operationId: updateAdminSettings
      tags: [admin]
      summary: Patch global app settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminSettingsInput"
      responses:
        "200":
          description: Updated settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSettingsOnlyResponse"

  /admin/metrics:
    get:
      operationId: getAdminMetrics
      tags: [admin]
      summary: Aggregated ML model accuracy metrics
      responses:
        "200":
          description: Metrics payload (open shape)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminMetricsResponse"

  /admin/retrain:
    post:
      operationId: triggerAdminRetrain
      tags: [admin]
      summary: Manually trigger background retrain pipeline
      responses:
        "200":
          description: Retrain trigger result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminRetrainResult"

  /admin/refresh-all:
    post:
      operationId: triggerAdminRefreshAll
      tags: [admin]
      summary: Invalidate all in-process upstream caches (matches, bookmakers).
      description: |
        Workaround для dev/Replit-окружения: сбрасывает withCache (matches:live,
        matches:upcoming, matches:heroes) чтобы при следующем запросе из мобилки
        данные подтянулись с upstream без ожидания TTL.
      responses:
        "200":
          description: Cache cleared
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminOpenObject"

  /admin/models/retrain:
    post:
      operationId: triggerAdminModelRetrain
      tags: [admin]
      summary: Per-model manual retrain (lightgbm bucket / market / live)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminModelRetrainInput"
      responses:
        "200":
          description: Started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminRetrainResult"
        "400":
          description: Invalid script or args
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminOpenObject"
        "409":
          description: Already in flight
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminRetrainResult"

  /admin/prune-snapshots:
    post:
      operationId: triggerAdminPrune
      tags: [admin]
      summary: Prune live_snapshots older than N days
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminPruneInput"
      responses:
        "200":
          description: Prune result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminPruneResult"

  /admin/odds-status:
    get:
      operationId: getAdminOddsStatus
      tags: [admin]
      summary: The Odds API status (key configured, last fetch result)
      responses:
        "200":
          description: Odds status payload (open shape)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminOpenObject"

  /admin/scheduler/state:
    get:
      operationId: getAdminSchedulerState
      tags: [admin]
      summary: Current scheduler/worker state and last tick details
      responses:
        "200":
          description: Scheduler state payload (open shape)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminOpenObject"

  /admin/models:
    get:
      operationId: getAdminModels
      tags: [admin]
      summary: Active model versions currently used in inference
      responses:
        "200":
          description: List of active models
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminModelsResponse"

  /admin/workers/config:
    get:
      operationId: getAdminWorkersConfig
      tags: [admin]
      summary: Current worker feature flags (DB + env)
      responses:
        "200":
          description: Worker flags
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminWorkersConfig"
    post:
      operationId: updateAdminWorkersConfig
      tags: [admin]
      summary: Update worker flags in DB (partial update)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminWorkersConfigInput"
      responses:
        "200":
          description: Updated config
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminWorkersConfig"

  /admin/jobs:
    get:
      operationId: getAdminJobs
      tags: [admin]
      summary: List recent one-shot admin jobs (in-memory, resets on restart)
      responses:
        "200":
          description: Job list + allowed scripts whitelist
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminJobsListResponse"

  /admin/jobs/run:
    post:
      operationId: runAdminJob
      tags: [admin]
      summary: Spawn a pnpm script in background, returns jobId immediately
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminJobRunInput"
      responses:
        "200":
          description: Job started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminJobRunResponse"

  /admin/jobs/{jobId}:
    get:
      operationId: getAdminJobStatus
      tags: [admin]
      summary: Poll job status and last 100 output lines
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Job status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminJobStatusResponse"
        "404":
          description: Job not found
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error: { type: string }

  /admin/models/history:
    get:
      operationId: getAdminModelsHistory
      tags: [admin]
      summary: All model versions (active + inactive), last 50 by date
      responses:
        "200":
          description: Model history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminModelsHistoryResponse"

  /admin/models/{id}/activate:
    post:
      operationId: activateAdminModel
      tags: [admin]
      summary: Atomically promote a model version to active (deactivates siblings)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Activation result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminModelActivateResponse"

  /admin/models/{id}/calibration:
    get:
      operationId: getAdminModelCalibration
      tags: [admin]
      summary: Isotonic calibration bins + featureImportance top-15 for a model version
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Model calibration payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminModelCalibrationResponse"

  /admin/coverage:
    get:
      operationId: getAdminCoverage
      tags: [admin]
      summary: Database coverage health snapshot (drafts/parsed/players/teams/live/outcomes)
      responses:
        "200":
          description: Coverage payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminCoverageResponse"

  /admin/parse-queue/stats:
    get:
      operationId: getAdminParseQueueStats
      tags: [admin]
      summary: Replay parse queue status, parsed totals, oldest queued items
      responses:
        "200":
          description: Parse queue stats (open shape)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminOpenObject"

  /admin/od-usage:
    get:
      operationId: getAdminOdUsage
      tags: [admin]
      summary: OpenDota API key usage (in-memory counters, resets on restart)
      responses:
        "200":
          description: OD usage stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminOdUsageResponse"

  /admin/bookmakers/probe:
    post:
      operationId: probeAdminBookmakers
      tags: [admin]
      summary: Diagnostic — live single request to each bookmaker source
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminBookmakerProbeInput"
      responses:
        "200":
          description: Per-source probe results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminBookmakerProbeResponse"

  /admin/integrations:
    get:
      operationId: getAdminIntegrations
      tags: [admin]
      summary: List external API integrations and their key status
      responses:
        "200":
          description: List of integrations
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminIntegrationsResponse"
    put:
      operationId: updateAdminIntegration
      tags: [admin]
      summary: Set or clear an integration key override (empty value clears)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminIntegrationUpdateInput"
      responses:
        "200":
          description: Updated integration status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminIntegrationUpdateResponse"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    # ---- Admin auth ----
    AdminLoginInput:
      type: object
      required: [token]
      properties:
        token:
          type: string
          minLength: 1
    AdminLoginResult:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean
        expiresAt:
          type: integer
          description: Session expiry as unix epoch ms
    AdminOkResult:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean
    AdminWhoami:
      type: object
      required: [authenticated, tokenConfigured]
      properties:
        authenticated:
          type: boolean
        tokenConfigured:
          type: boolean

    # ---- Admin settings ----
    AdminAppSettings:
      type: object
      required:
        - id
        - useBookmakerOdds
        - liveSnapshotPruneDays
        - trainWindowDays
        - trainMaxPatches
        - trainMinSamples
        - updatedAt
      properties:
        id:
          type: integer
        useBookmakerOdds:
          type: boolean
        liveSnapshotPruneDays:
          type: integer
        trainWindowDays:
          type: integer
          description: Максимальное окно истории матчей для обучения (дней)
          minimum: 30
          maximum: 730
        trainMaxPatches:
          type: integer
          description: Максимальное число последних патчей в тренировочных данных
          minimum: 1
          maximum: 20
        trainMinSamples:
          type: integer
          description: Минимальное число сэмплов для запуска обучения
          minimum: 50
          maximum: 100000
        notes:
          type: ["string", "null"]
        updatedAt:
          type: string
          description: ISO-8601 timestamp
    AdminSettingsResponse:
      type: object
      required: [settings, oddsApiKeyConfigured]
      properties:
        settings:
          $ref: "#/components/schemas/AdminAppSettings"
        oddsApiKeyConfigured:
          type: boolean
    AdminSettingsOnlyResponse:
      type: object
      required: [settings]
      properties:
        settings:
          $ref: "#/components/schemas/AdminAppSettings"
    AdminSettingsInput:
      type: object
      properties:
        useBookmakerOdds:
          type: boolean
        liveSnapshotPruneDays:
          type: integer
          minimum: 1
          maximum: 365
        trainWindowDays:
          type: integer
          minimum: 30
          maximum: 730
        trainMaxPatches:
          type: integer
          minimum: 1
          maximum: 20
        trainMinSamples:
          type: integer
          minimum: 50
          maximum: 100000
        notes:
          type: ["string", "null"]

    # ---- Admin retrain / prune / metrics ----
    AdminRetrainResult:
      type: object
      additionalProperties: true
      properties:
        ok:
          type: boolean
        status:
          type: string
        message:
          type: string
    AdminModelRetrainInput:
      type: object
      required: [script]
      properties:
        script:
          type: string
          enum:
            - "train:model"
            - "train:lightgbm"
            - "train:market-models"
            - "train:live-model"
        label:
          type: string
          description: For train:lightgbm — bucket label like "v3/t1".
        market:
          type: string
          description: For train:market-models — first_blood|total_kills|total_duration|all.
    AdminPruneInput:
      type: object
      properties:
        days:
          type: integer
          minimum: 1
          maximum: 365
    AdminPruneResult:
      type: object
      required: [days, deleted]
      properties:
        days:
          type: integer
        deleted:
          type: integer
    AdminMetricsResponse:
      type: object
      additionalProperties: true

    # ---- Admin models ----
    AdminModelRow:
      type: object
      required:
        - id
        - kind
        - version
        - algorithm
        - engine
        - featuresVersion
        - createdAt
      properties:
        id:
          type: integer
        kind:
          type: string
        version:
          type: string
        algorithm:
          type: string
        engine:
          type: string
        featuresVersion:
          type: integer
        trainAccuracy:
          type: ["number", "null"]
        testAccuracy:
          type: ["number", "null"]
        brierScore:
          type: ["number", "null"]
        trainSampleSize:
          type: ["integer", "null"]
        testSampleSize:
          type: ["integer", "null"]
        hardMatchAccuracy:
          type: ["number", "null"]
        hardMatchBrier:
          type: ["number", "null"]
        hardMatchCount:
          type: ["integer", "null"]
        createdAt:
          type: string
        isActive:
          type: ["boolean", "null"]
    AdminModelsResponse:
      type: object
      required: [models]
      properties:
        models:
          type: array
          items:
            $ref: "#/components/schemas/AdminModelRow"

    AdminModelsHistoryResponse:
      type: object
      required: [models]
      properties:
        models:
          type: array
          items:
            $ref: "#/components/schemas/AdminModelRow"

    AdminModelActivateResponse:
      type: object
      required: [ok, alreadyActive, activatedId, kind, engine, version]
      properties:
        ok: { type: boolean }
        alreadyActive: { type: boolean }
        activatedId: { type: integer }
        kind: { type: string }
        engine: { type: string }
        version: { type: string }

    AdminModelCalibrationBin:
      type: object
      required: [minProb, maxProb, calibratedProb]
      properties:
        minProb: { type: number }
        maxProb: { type: number }
        calibratedProb: { type: number }

    AdminModelCalibrationBlock:
      type: object
      required: [identity, bins]
      properties:
        identity: { type: boolean }
        sampleSize: { type: ["integer", "null"] }
        bins:
          type: array
          items:
            $ref: "#/components/schemas/AdminModelCalibrationBin"

    AdminModelFeatureImportanceItem:
      type: object
      required: [name, weight]
      properties:
        name: { type: string }
        weight: { type: number }

    AdminModelDriftItem:
      type: object
      required: [name, trainMean, testMean, rel]
      properties:
        name: { type: string }
        trainMean: { type: number }
        testMean: { type: number }
        rel: { type: number }

    AdminModelFeatureViewBlock:
      type: object
      required: [modelFv, stale]
      properties:
        modelFv: { type: integer }
        currentFv: { type: ["integer", "null"] }
        stale: { type: boolean }

    AdminModelCalibrationResponse:
      type: object
      required: [id, kind, version, engine, featureView, calibration, featureImportance, drifts]
      properties:
        id: { type: integer }
        kind: { type: string }
        version: { type: string }
        engine: { type: string }
        featureView:
          $ref: "#/components/schemas/AdminModelFeatureViewBlock"
        calibration:
          $ref: "#/components/schemas/AdminModelCalibrationBlock"
        featureImportance:
          type: array
          items:
            $ref: "#/components/schemas/AdminModelFeatureImportanceItem"
        drifts:
          type: array
          items:
            $ref: "#/components/schemas/AdminModelDriftItem"

    AdminWorkersConfig:
      type: object
      required:
        - liveWorkerDisabled
        - schedulerDisabled
        - autoRetrainDisabled
        - envDisableLiveWorker
        - envDisableScheduler
        - envDisableAutoRetrain
        - heartbeats
        - note
      properties:
        ok: { type: boolean }
        liveWorkerDisabled: { type: boolean }
        schedulerDisabled: { type: boolean }
        autoRetrainDisabled: { type: boolean }
        envDisableLiveWorker: { type: boolean }
        envDisableScheduler: { type: boolean }
        envDisableAutoRetrain: { type: boolean }
        heartbeats:
          type: object
          required: [liveWorker, scheduler]
          properties:
            liveWorker: { $ref: "#/components/schemas/WorkerHeartbeat" }
            scheduler:  { $ref: "#/components/schemas/WorkerHeartbeat" }
        note: { type: string }

    WorkerHeartbeat:
      type: object
      required: [lastTickAt, lastStatus, lastError, totalTicks, lastDurationMs]
      properties:
        lastTickAt:
          type: ["string", "null"]
          description: ISO timestamp последнего тика воркера (in-memory, сбрасывается при рестарте api-server)
        lastStatus:
          type: string
          enum: [ok, error, idle]
        lastError:
          type: ["string", "null"]
        totalTicks:
          type: integer
        lastDurationMs:
          type: ["integer", "null"]

    AdminWorkersConfigInput:
      type: object
      properties:
        liveWorkerDisabled: { type: boolean }
        schedulerDisabled: { type: boolean }
        autoRetrainDisabled: { type: boolean }

    AdminJobSummary:
      type: object
      required: [id, script, args, status, startedAt, durationMs]
      properties:
        id: { type: string }
        script: { type: string }
        args: { type: array, items: { type: string } }
        status: { type: string, enum: [running, done, failed] }
        startedAt: { type: string }
        finishedAt: { type: ["string", "null"] }
        exitCode: { type: ["integer", "null"] }
        durationMs: { type: integer }

    AdminJobsListResponse:
      type: object
      required: [jobs, allowedScripts]
      properties:
        jobs:
          type: array
          items:
            $ref: "#/components/schemas/AdminJobSummary"
        allowedScripts:
          type: array
          items: { type: string }

    AdminJobRunInput:
      type: object
      required: [script]
      properties:
        script: { type: string }
        args: { type: array, items: { type: string } }

    AdminJobRunResponse:
      type: object
      required: [jobId, script, args, startedAt]
      properties:
        jobId: { type: string }
        script: { type: string }
        args: { type: array, items: { type: string } }
        startedAt: { type: string }

    AdminJobStatusResponse:
      type: object
      required: [id, script, args, status, startedAt, output, durationMs]
      properties:
        id: { type: string }
        script: { type: string }
        args: { type: array, items: { type: string } }
        status: { type: string, enum: [running, done, failed] }
        startedAt: { type: string }
        finishedAt: { type: ["string", "null"] }
        exitCode: { type: ["integer", "null"] }
        output: { type: array, items: { type: string } }
        durationMs: { type: integer }

    # ---- Admin coverage (data health) ----
    AdminCoverageResponse:
      type: object
      required:
        - drafts
        - parsed
        - playerStats
        - teamFeatures
        - liveSnapshots
        - prematchOutcomes
        - generatedAt
      properties:
        drafts:
          type: object
          required: [covered30d, total30d, pct30d, covered90d, total90d, pct90d, covered365d, total365d, pct365d]
          properties:
            covered30d: { type: integer }
            total30d: { type: integer }
            pct30d: { type: number }
            covered90d: { type: integer }
            total90d: { type: integer }
            pct90d: { type: number }
            covered365d: { type: integer }
            total365d: { type: integer }
            pct365d: { type: number }
        parsed:
          type: object
          required: [parsed60d, total60d, pct60d, parsed180d, total180d, pct180d, parsedTotal, cruiseReadyThreshold, cruiseReady60d]
          properties:
            parsed60d: { type: integer }
            total60d: { type: integer }
            pct60d: { type: number }
            parsed180d: { type: integer }
            total180d: { type: integer }
            pct180d: { type: number }
            parsedTotal: { type: integer }
            cruiseReadyThreshold: { type: integer }
            cruiseReady60d: { type: boolean }
        playerStats:
          type: object
          required: [playerHeroRows, playerRatingRows]
          properties:
            playerHeroRows: { type: integer }
            playerRatingRows: { type: integer }
        teamFeatures:
          type: object
          required: [recentFormRows, extendedRows, h2hRows]
          properties:
            recentFormRows: { type: integer }
            recentFormLastAt: { type: ["string", "null"] }
            extendedRows: { type: integer }
            extendedLastAt: { type: ["string", "null"] }
            h2hRows: { type: integer }
        liveSnapshots:
          type: object
          required: [last24h, withStratzEnrichment, stratzPct]
          properties:
            last24h: { type: integer }
            withStratzEnrichment: { type: integer }
            stratzPct: { type: number }
            lastCapturedAt: { type: ["string", "null"] }
        prematchOutcomes:
          type: object
          required: [total, last30d, liveTrainReadyThreshold, liveTrainReady]
          properties:
            total: { type: integer }
            last30d: { type: integer }
            liveTrainReadyThreshold: { type: integer }
            liveTrainReady: { type: boolean }
        generatedAt:
          type: string

    # ---- Admin OD usage ----
    AdminOdUsageResponse:
      type: object
      required: [today, last7d, last30d, estimatedCostUsdToday, estimatedCostUsdLast30d, hasKey, history, note]
      properties:
        today: { type: integer }
        last7d: { type: integer }
        last30d: { type: integer }
        estimatedCostUsdToday: { type: number }
        estimatedCostUsdLast30d: { type: number }
        hasKey: { type: boolean }
        history:
          type: array
          items:
            type: object
            required: [date, count, estimatedCostUsd]
            properties:
              date: { type: string }
              count: { type: integer }
              estimatedCostUsd: { type: number }
        note: { type: string }

    # ---- Admin integrations (external API keys) ----
    AdminIntegrationStatus:
      type: object
      required:
        - envName
        - label
        - description
        - docUrl
        - category
        - sensitive
        - configured
        - source
      properties:
        envName:
          type: string
        label:
          type: string
        description:
          type: string
        docUrl:
          type: string
        howToGet:
          type: string
          description: Short Russian-language instruction on how to obtain the key/token.
        category:
          type: string
          enum: [data-source, odds-feed, network, bookmaker]
        sensitive:
          type: boolean
        configured:
          type: boolean
        source:
          type: string
          enum: [override, env, none]
        preview:
          type: ["string", "null"]
        overrideUpdatedAt:
          type: ["string", "null"]
        requestsTotal:
          type: integer
          nullable: true
          description: Total HTTP requests sent to this source since server boot.
        responsesOk:
          type: integer
          nullable: true
          description: Successful responses (HTTP 2xx with parsed events) since boot.
        lastTickStatus:
          nullable: true
          type: object
          required: [ok, events, checkedAt, durationMs]
          properties:
            ok:
              type: boolean
            events:
              type: integer
              description: Number of events returned in the last tick (0 if error).
            error:
              type: ["string", "null"]
            checkedAt:
              type: string
              description: ISO timestamp of the last fetch attempt.
            durationMs:
              type: integer
    AdminIntegrationsResponse:
      type: object
      required: [integrations]
      properties:
        integrations:
          type: array
          items:
            $ref: "#/components/schemas/AdminIntegrationStatus"
    AdminIntegrationUpdateInput:
      type: object
      required: [envName]
      properties:
        envName:
          type: string
          minLength: 1
        value:
          type: ["string", "null"]
          description: New value; empty string or null clears the override and falls back to ENV.
    AdminIntegrationUpdateResponse:
      type: object
      required: [integration]
      properties:
        integration:
          $ref: "#/components/schemas/AdminIntegrationStatus"

    # ---- Admin bookmaker probe (diagnostic) ----
    AdminBookmakerProbeInput:
      type: object
      properties:
        source:
          type: string
          description: Optional — probe only this source id. Empty = all known sources.
    AdminBookmakerProbeResult:
      type: object
      required:
        - source
        - name
        - url
        - ok
        - latencyMs
        - proxyUsed
        - bodyPreview
      properties:
        source:
          type: string
        name:
          type: string
        url:
          type: string
        ok:
          type: boolean
        httpStatus:
          type: ["integer", "null"]
        contentType:
          type: ["string", "null"]
        bodySize:
          type: ["integer", "null"]
        latencyMs:
          type: integer
        proxyUsed:
          type: boolean
        bodyPreview:
          type: string
        error:
          type: string
        rateLimited:
          type: boolean
    AdminBookmakerProbeResponse:
      type: object
      required: [probedAt, proxyConfigured, results]
      properties:
        probedAt:
          type: string
        proxyConfigured:
          type: boolean
        results:
          type: array
          items:
            $ref: "#/components/schemas/AdminBookmakerProbeResult"

    # ---- Open-shape payloads (scheduler state, odds status) ----
    AdminOpenObject:
      type: object
      additionalProperties: true
