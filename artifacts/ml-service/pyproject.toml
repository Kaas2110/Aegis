[project]
name = "ml-service"
version = "0.1.0"
description = "LightGBM inference + training service for Aegis Dota analytics (Wave 4)"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.115,<0.116",
    "uvicorn[standard]>=0.32,<0.33",
    "lightgbm>=4.5,<5.0",
    "scikit-learn>=1.5,<2.0",
    "numpy>=1.26,<3.0",
    "psycopg[binary]>=3.2,<4.0",
    "pydantic>=2.9,<3.0",
]

[tool.uv]
package = false
